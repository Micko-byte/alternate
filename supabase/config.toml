project_id = "alternate"

# Hosted auth: where sign-up / sign-in emails and redirects may send people
[auth]
site_url = "https://alternate-two.vercel.app"
additional_redirect_urls = [
  "https://alternate-two.vercel.app/**",
  "https://alternate-micko-bytes-projects.vercel.app/",
  "https://alternate-micko-bytes-projects.vercel.app/**",
  "https://alternate-*-micko-bytes-projects.vercel.app",
  "https://alternate-*-micko-bytes-projects.vercel.app/**",
  "http://localhost:8080/**",
]

# Functions check the signed-in user themselves (works with the new publishable keys)
[functions.tryon-process]
verify_jwt = false

[functions.payments-init]
verify_jwt = false

[functions.payments-verify]
verify_jwt = false

# Paystack calls this directly; it is verified with the Paystack signature
[functions.paystack-webhook]
verify_jwt = false

[functions.draft-product]
verify_jwt = false

[functions.inspect-garment]
verify_jwt = false

[functions.analyze-body]
verify_jwt = false

[functions.admin-users]
verify_jwt = false

# Branded auth emails (letterhead, logo, brand colours)
[auth.email.template.confirmation]
subject = "Confirm your email for ALTERNATE"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your ALTERNATE password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your ALTERNATE sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email for ALTERNATE"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You're invited to ALTERNATE"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your ALTERNATE confirmation code"
content_path = "./supabase/templates/reauthentication.html"
